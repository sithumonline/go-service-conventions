openapi: 3.0.3
info:
  title: Widget Service API
  version: 1.0.0
paths:
  /orgs/{orgName}/widgets:
    get:
      operationId: listWidgets
      parameters:
        - { name: orgName, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetListResponse" }
    post:
      operationId: createWidget
      parameters:
        - { name: orgName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWidgetRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetResponse" }
        "409":
          description: Conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /orgs/{orgName}/widgets/{widgetName}:
    get:
      operationId: getWidget
      parameters:
        - { name: orgName, in: path, required: true, schema: { type: string } }
        - { name: widgetName, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WidgetResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteWidget
      parameters:
        - { name: orgName, in: path, required: true, schema: { type: string } }
        - { name: widgetName, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
components:
  schemas:
    CreateWidgetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        displayName: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    WidgetResponse:
      type: object
      required: [name, displayName, labels, createdAt]
      properties:
        name: { type: string }
        displayName: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    WidgetListResponse:
      type: object
      required: [widgets, total, limit, offset]
      properties:
        widgets:
          type: array
          items: { $ref: "#/components/schemas/WidgetResponse" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
        reason: { type: string }
